<!doctype html><html lang="th"><head><meta name="viewport" content="width=device-width, initial-scale=1"><base target="_top"><style>@import url('https://fonts.googleapis.com/css2?family=Doto:wght@400;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');:root{--bg:#000;--surface:#111;--surface2:#1a1a1a;--border:#292929;--line:#333;--muted:#999;--text:#e8e8e8;--white:#fff;--red:#d71921;--green:#4a9e5c;--amber:#d4a843;--blue:#5b9bf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1280px;margin:auto;padding:28px clamp(16px,4vw,56px) 56px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:22px}.eyebrow,.label,.status{font:11px/1.2 'Space Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(30px,5vw,58px);line-height:1.05;margin:7px 0 0;color:var(--white);font-weight:500;letter-spacing:-.03em}.hero-dot{color:var(--red)}.clock{font-family:'Doto','Space Mono',monospace;font-size:28px;color:var(--white);text-align:right}.layout{display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,1.28fr);gap:24px;margin-top:32px}.station,.review{background:var(--surface);border:1px solid var(--border);padding:22px}.station{min-height:420px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:22px}.section-title{font-size:20px;font-weight:500;color:var(--white)}.upload{border:1px dashed var(--line);min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:border-color .2s}.upload.drag{border-color:var(--red)}.upload input{display:none}.upload-btn,.primary{border:0;background:var(--white);color:#000;padding:12px 18px;font-weight:500;border-radius:6px}.upload-btn:hover,.primary:hover{background:#dcdcdc}.preview{width:100%;max-height:240px;object-fit:contain;margin-top:16px;border:1px solid var(--border);display:none}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.meta-box{border-top:1px solid var(--border);padding-top:10px}.meta-value{font-family:'Space Mono',monospace;margin-top:4px}.statusline{margin-top:18px;padding:10px 0;color:var(--muted);font:12px 'Space Mono',monospace}.statusline.live{color:var(--green)}.statusline.warn{color:var(--amber)}.statusline.error{color:var(--red)}.review-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input{width:100%;background:transparent;border:1px solid var(--border);color:var(--text);padding:10px 11px;border-radius:4px}.field input:focus{outline:1px solid var(--red);border-color:var(--red)}.items-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.items{display:flex;flex-direction:column;gap:10px}.item{border:1px solid var(--border);padding:14px;display:grid;grid-template-columns:1.4fr .6fr .8fr .8fr auto;gap:10px;align-items:end}.item input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px;border-radius:4px;width:100%}.remove{border:1px solid var(--border);background:transparent;color:var(--muted);padding:9px;border-radius:4px}.remove:hover{color:var(--red);border-color:var(--red)}.warnings{margin-top:14px;color:var(--amber);font:12px 'Space Mono',monospace;white-space:pre-line}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.secondary{background:transparent;color:var(--text);border:1px solid var(--line);padding:11px 16px;border-radius:6px}.secondary:hover{border-color:var(--white)}@media(max-width:900px){.layout{grid-template-columns:1fr}.station{min-height:0}.review-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.shell{padding:18px 14px 34px}.topbar{display:block}.clock{text-align:left;margin-top:12px}.layout{margin-top:20px}.station,.review{padding:16px}.review-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.item{grid-template-columns:1fr 1fr}.item .product{grid-column:1/-1}.item .remove{grid-column:2}.actions{flex-direction:column}.actions button{width:100%}}
</style>
</head><body><script>
const state={file:null,previewUrl:'',data:{invoice:{},items:[]}};
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(text,kind=''){const el=$('#status');el.textContent='['+text+']';el.className='statusline '+kind;}
function field(label,key,value,full=false){return `<label class="field ${full?'full':''}"><span class="label">${label}</span><input data-key="${key}" value="${esc(value)}"></label>`}
function render(){const d=state.data, inv=d.invoice||{};$('#review').innerHTML=`<div class="section-head"><div class="section-title">ตรวจสอบข้อมูล OCR</div><span class="status">${d.items.length} รายการ</span></div><div class="review-grid">${field('เลขที่บิล / INVOICE NO','invoiceNo',inv.invoiceNo)}${field('บริษัท / COMPANY','companyName',inv.companyName)}${field('เลขผู้เสียภาษี 13 หลัก','taxId',inv.taxId)}${field('วันที่ / DATE','invoiceDate',inv.invoiceDate)}${field('พนักงานขาย / SALESPERSON','salesperson',inv.salesperson)}${field('ยอดรวมสุทธิ VAT / GRAND TOTAL','grandTotalInclVat',inv.grandTotalInclVat)} </div><div class="items-head"><span class="label">รายการสินค้า / LINE ITEMS</span><button class="secondary" id="add">+ เพิ่มรายการ</button></div><div class="items">${d.items.map((x,i)=>`<div class="item" data-i="${i}"><label class="field product"><span class="label">สินค้า</span><input data-item="productName" value="${esc(x.productName)}"></label><label class="field"><span class="label">จำนวน</span><input type="number" step="any" data-item="quantity" value="${x.quantity||''}"></label><label class="field"><span class="label">GPU CODE</span><input data-item="gpuCode" value="${esc(x.gpuCode)}"></label><label class="field"><span class="label">TPU CODE</span><input data-item="tpuCode" value="${esc(x.tpuCode)}"></label><label class="field"><span class="label">ราคา/หน่วย VAT</span><input type="number" step="any" data-item="unitPriceInclVat" value="${x.unitPriceInclVat||''}"></label><label class="field"><span class="label">รวมรายการ VAT</span><input type="number" step="any" data-item="totalPriceInclVat" value="${x.totalPriceInclVat||''}"></label><button class="remove" data-remove="${i}">ลบ</button></div>`).join('')}</div><div class="warnings">${(d.warnings||[]).map(esc).join('\n')}</div><div class="actions"><button class="secondary" id="reset">ล้างข้อมูล</button><button class="primary" id="save">บันทึกลง Google Sheets</button></div>`;bindReview();}
function bindReview(){document.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>state.data.invoice[el.dataset.key]=el.value);document.querySelectorAll('[data-item]').forEach(el=>el.oninput=()=>{state.data.items[el.closest('.item').dataset.i][el.dataset.item]=el.type==='number'?Number(el.value):el.value});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{state.data.items.splice(Number(el.dataset.remove),1);render()});$('#add').onclick=()=>{state.data.items.push({productName:'',quantity:1,unitPriceInclVat:0,totalPriceInclVat:0});render()};$('#reset').onclick=()=>{state.data={invoice:{},items:[]};$('#review').innerHTML='';setStatus('READY')};$('#save').onclick=save;}
function readFile(file){if(!file)return;if(file.size>12*1024*1024)return setStatus('ERROR: ไฟล์ใหญ่เกิน 12 MB','error');if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(file.type))return setStatus('ERROR: ชนิดไฟล์ไม่รองรับ','error');state.data={invoice:{},items:[]};state.file=file; if(state.previewUrl)URL.revokeObjectURL(state.previewUrl);state.previewUrl=URL.createObjectURL(file);const p=$('#preview');p.src=state.previewUrl;p.style.display='block';$('#filemeta').textContent=file.name+' · '+Math.round(file.size/1024)+' KB';setStatus('READY — กดเริ่ม OCR','live');}
async function extract(){if(!state.file)return setStatus('เลือกไฟล์ก่อน','warn');setStatus('OCR RUNNING — กำลังอ่านบิล','');const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(state.file)});const payload={base64,mimeType:state.file.type,fileName:state.file.name};if(window.google?.script?.run){google.script.run.withSuccessHandler(r=>{if(!r.ok)return setStatus('ERROR: '+r.error,'error');state.data={invoice:r.data.invoice||{invoiceNo:r.data.invoiceNo,companyName:r.data.companyName,taxId:r.data.taxId,invoiceDate:r.data.invoiceDate,salesperson:r.data.salesperson,grandTotalInclVat:r.data.grandTotalInclVat,imageUrl:r.data.imageUrl,vatStatus:r.data.vatStatus},items:r.data.items||[],warnings:r.data.warnings||[]};render();setStatus('REVIEW REQUIRED — ตรวจสอบก่อนบันทึก','warn')}).withFailureHandler(e=>setStatus('ERROR: '+e.message,'error')).extractInvoice(payload)}else{state.data={invoice:{invoiceNo:'INV-DEMO-001',companyName:'บริษัทตัวอย่าง จำกัด',taxId:'0105559999999',invoiceDate:'2026-09-29',salesperson:'Demo',grandTotalInclVat:1070,imageUrl:''},items:[{productName:'สินค้า OCR ตัวอย่าง',quantity:2,gpuCode:'123456',tpuCode:'654321',unitPriceInclVat:535,totalPriceInclVat:1070}],warnings:['โหมดตัวอย่าง: เชื่อมต่อ Google Apps Script เพื่อใช้งาน OCR จริง']};render();setStatus('REVIEW REQUIRED — DEMO','warn')}}
function save(){if(window.google?.script?.run){setStatus('SAVING — กำลังบันทึก','');google.script.run.withSuccessHandler(r=>{if(!r.ok)return setStatus('ERROR: '+r.error,'error');setStatus('SAVED — '+r.data.rowsSaved+' แถว','live')}).withFailureHandler(e=>setStatus('ERROR: '+e.message,'error')).saveInvoice(state.data)}else setStatus('SAVED — DEMO ONLY','live')}
function init(){document.body.innerHTML=`<main class="shell"><header class="topbar"><div><div class="eyebrow">INVOICE OCR / INVENTORY <span class="hero-dot">●</span></div><h1>อ่านบิล.<br>เก็บสต็อก.</h1></div><div class="clock" id="clock">--:--</div></header><div class="layout"><section class="station"><div class="section-head"><div class="section-title">อัปโหลดเอกสาร</div><span class="status">01 / INPUT</span></div><div class="upload" id="drop"><div class="label">DRAG & DROP / CAMERA</div><p>ถ่ายรูปหรือเลือกไฟล์บิล<br>JPG · PNG · WEBP · PDF</p><label class="upload-btn">เลือกไฟล์<input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label><img class="preview" id="preview"><div class="meta"><div class="meta-box"><div class="label">FILE</div><div class="meta-value" id="filemeta">—</div></div><div class="meta-box"><div class="label">LIMIT</div><div class="meta-value">12 MB</div></div></div></div><button class="primary" id="extract" style="width:100%;margin-top:14px">เริ่ม OCR</button><div id="status" class="statusline">[READY]</div></section><section class="review" id="review"><div class="section-head"><div class="section-title">รอเอกสาร</div><span class="status">02 / REVIEW</span></div><p class="label">ข้อมูลที่สกัดได้จะแสดงที่นี่เพื่อให้ตรวจสอบและแก้ไขก่อนบันทึก</p></section></div></main>`;$('#file').onchange=e=>readFile(e.target.files[0]);$('#extract').onclick=extract;const drop=$('#drop');['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.ondrop=e=>readFile(e.dataTransfer.files[0]);setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),1000)}init();
</script>
</body></html>
