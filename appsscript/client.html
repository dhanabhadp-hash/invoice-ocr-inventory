<script>

const state={file:null,previewUrl:'',data:{invoice:{},items:[]},busy:false,records:[],selected:null,query:'',view:'upload'};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>{const n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)&&n?new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n):'—'};
const input=(label,key,value,type='text',extra='')=>`<label class="flex min-w-0 flex-col gap-2"><span class="font-mono text-[10px] uppercase tracking-[.12em] text-zinc-500">${label}</span><input class="focus-signal w-full rounded-md border border-zinc-800 bg-black px-3 py-2.5 text-sm text-zinc-100" data-key="${key}" type="${type}" value="${esc(value)}" ${extra}></label>`;
function notify(text,kind='info'){const host=$('#toast');const tone=kind==='error'?'border-red-800 text-red-200':kind==='ok'?'border-emerald-800 text-emerald-200':'border-zinc-700 text-zinc-200';host.className='fixed inset-0 z-[100] flex items-center justify-center bg-black/75 p-4';host.innerHTML=`<div class="w-full max-w-md rounded-xl border ${tone} bg-zinc-950 p-5 text-center shadow-2xl" role="alertdialog"><div class="font-mono text-[10px] tracking-[.18em]">${kind==='error'?'ERROR':kind==='ok'?'SUCCESS':'NOTICE'}</div><div class="mt-3 whitespace-pre-line text-sm leading-6">${esc(text)}</div><button class="mt-4 w-full rounded-md border border-zinc-700 px-3 py-2 text-xs text-zinc-300 hover:border-white" onclick="$('#toast').className='hidden'">ปิดข้อความ</button></div>`}
function setStatus(text,kind=''){const el=$('#status');if(!el)return;el.textContent='['+text+']';el.className='mt-4 font-mono text-[11px] tracking-wide '+(kind==='ok'?'text-emerald-500':kind==='warn'?'text-amber-400':kind==='error'?'text-red-500':'text-zinc-500')}
function emptyReview(){return `<div class="flex min-h-[280px] flex-col items-center justify-center text-center"><div class="font-mono text-4xl text-zinc-800">◎</div><p class="mt-4 font-mono text-[11px] uppercase tracking-[.12em] text-zinc-600">อัปโหลดบิลเพื่อเริ่มตรวจสอบ</p></div>`}
function renderReview(){const d=state.data,inv=d.invoice||{};$('#review').innerHTML=`<div class="mb-6 flex items-end justify-between gap-3"><div><p class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-500">02 / REVIEW</p><h2 class="mt-1 text-xl font-medium text-white">ตรวจสอบข้อมูล OCR</h2></div><span class="font-mono text-xs text-zinc-500">${d.items.length} รายการ</span></div><div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">${input('เลขที่บิล / INVOICE NO','invoiceNo',inv.invoiceNo)}${input('บริษัท / COMPANY','companyName',inv.companyName)}${input('เลขผู้เสียภาษี 13 หลัก','taxId',inv.taxId,'text','inputmode="numeric" maxlength="13"')}${input('วันที่ / DATE','invoiceDate',inv.invoiceDate,'date')}${input('พนักงานขาย / SALESPERSON','salesperson',inv.salesperson)}${input('ยอดรวมสุทธิ VAT / GRAND TOTAL','grandTotalInclVat',inv.grandTotalInclVat,'number','step="0.01"')}</div><div class="mt-8 flex items-center justify-between gap-3"><span class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-500">รายการสินค้า / LINE ITEMS</span><button class="rounded-md border border-zinc-700 px-3 py-2 text-xs text-zinc-300 hover:border-white" id="add">+ เพิ่มรายการ</button></div><div class="mt-3 space-y-3">${d.items.map((x,i)=>`<div class="grid grid-cols-1 gap-3 rounded-md border border-zinc-800 bg-zinc-950 p-3 sm:grid-cols-2 xl:grid-cols-[minmax(0,1.6fr)_80px_110px_110px_130px_130px_auto]" data-i="${i}">${itemInput('สินค้า','productName',x.productName,'sm:col-span-2 xl:col-span-1')}${itemInput('จำนวน','quantity',x.quantity,'','number')}${itemInput('GPU CODE','gpuCode',x.gpuCode)}${itemInput('TPU CODE','tpuCode',x.tpuCode)}${itemInput('ราคา/หน่วย VAT','unitPriceInclVat',x.unitPriceInclVat,'','number')}${itemInput('รวมรายการ VAT','totalPriceInclVat',x.totalPriceInclVat,'','number')}<button class="rounded-md border border-zinc-800 px-3 py-2 text-xs text-zinc-500 hover:border-red-700 hover:text-red-500" data-remove="${i}">ลบ</button></div>`).join('')}</div><div class="mt-4 whitespace-pre-line font-mono text-[11px] leading-6 text-amber-400">${(d.warnings||[]).map(esc).join('\n')}</div><div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button class="rounded-md border border-zinc-700 px-4 py-3 text-sm text-zinc-300 hover:border-white" id="reset">ล้างข้อมูล</button><button class="rounded-md bg-white px-4 py-3 text-sm font-medium text-black hover:bg-zinc-300 disabled:opacity-40" id="save">บันทึกลง Google Sheets</button></div>`;bindReview()}
function itemInput(label,key,value,layout='',type='text'){return `<label class="flex min-w-0 flex-col gap-2 ${layout}"><span class="font-mono text-[10px] uppercase tracking-[.1em] text-zinc-500">${label}</span><input class="focus-signal w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-2.5 text-sm text-zinc-100" data-item="${key}" type="${type}" value="${esc(value)}" ${type==='number'?'step="0.01"':''}></label>`}
function bindReview(){document.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>state.data.invoice[el.dataset.key]=el.value);document.querySelectorAll('[data-item]').forEach(el=>el.oninput=()=>{const item=state.data.items[el.closest('[data-i]').dataset.i];item[el.dataset.item]=el.type==='number'?Number(el.value):el.value});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{state.data.items.splice(Number(el.dataset.remove),1);renderReview()});$('#add').onclick=()=>{state.data.items.push({productName:'',quantity:1,gpuCode:'',tpuCode:'',unitPriceInclVat:0,totalPriceInclVat:0});renderReview()};$('#reset').onclick=()=>{state.data={invoice:{},items:[]};$('#review').innerHTML=emptyReview();setStatus('READY')};$('#save').onclick=save}
function readFile(file){if(!file)return;if(file.size>12*1024*1024)return notify('ไฟล์ใหญ่เกิน 12 MB','error');if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(file.type))return notify('ชนิดไฟล์ไม่รองรับ','error');state.data={invoice:{},items:[]};state.file=file;if(state.previewUrl)URL.revokeObjectURL(state.previewUrl);state.previewUrl=URL.createObjectURL(file);$('#preview').src=state.previewUrl;$('#preview').classList.remove('hidden');$('#filemeta').textContent=file.name+' · '+Math.round(file.size/1024)+' KB';setStatus('READY — กดเริ่ม OCR','ok');$('#review').innerHTML=emptyReview()}
async function apiJson(response){const text=await response.text();let body;try{body=JSON.parse(text)}catch(_){throw new Error(`เซิร์ฟเวอร์ตอบกลับไม่ใช่ JSON (HTTP ${response.status})`)}return {response,body}}
async function extract(){if(!state.file)return notify('กรุณาเลือกไฟล์บิลก่อนเริ่ม OCR','error');if(state.busy)return;state.busy=true;$('#extract').disabled=true;setStatus('OCR RUNNING — กำลังอ่านบิล');try{const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(state.file)});const {response,body:r}=await apiJson(await fetch('/api/ocr',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({base64,mimeType:state.file.type,fileName:state.file.name})}));if(!response.ok||!r.ok)throw new Error(r.error||'OCR ไม่สำเร็จ');state.data={invoice:r.data.invoice||{},items:r.data.items||[],warnings:r.data.warnings||[]};renderReview();notify('OCR สำเร็จ กรุณาตรวจสอบข้อมูลก่อนบันทึก');setStatus('REVIEW REQUIRED — ตรวจสอบก่อนบันทึก','warn')}catch(e){notify(e.message||'เกิดข้อผิดพลาดระหว่าง OCR','error');setStatus('ERROR: '+e.message,'error')}finally{state.busy=false;$('#extract').disabled=false}}
function resetAfterSave(){state.data={invoice:{},items:[]};state.file=null;if(state.previewUrl){URL.revokeObjectURL(state.previewUrl);state.previewUrl=''}$('#file').value='';$('#preview').src='';$('#preview').classList.add('hidden');$('#filemeta').textContent='—';$('#review').innerHTML=emptyReview()}
function save(){if(state.busy)return;state.busy=true;setStatus('SAVING — กำลังบันทึก');fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(state.data)}).then(apiJson).then(({response,body:r})=>{if(!response.ok||!r.ok)throw new Error(r.error||'บันทึกไม่สำเร็จ');resetAfterSave();notify('บันทึก Google Sheets สำเร็จ '+r.data.rowsSaved+' แถว','ok');setStatus('SAVED — '+r.data.rowsSaved+' แถว','ok')}).catch(e=>{notify(e.message||'บันทึกไม่สำเร็จ','error');setStatus('ERROR: '+e.message,'error')}).finally(()=>state.busy=false)}
function imageProxy(url){const text=String(url||'');if(text.startsWith('/api/invoices/image/'))return text;const m=text.match(/[-\w]{10,}/);return m?'/api/invoices/image/'+m[0]:''}
function recordCard(r,i){const src=imageProxy(r.imageUrl);return `<div class="group overflow-hidden rounded-lg border border-zinc-900 bg-zinc-950 text-left hover:border-zinc-600">${src?`<button class="block w-full" data-image="${esc(src)}" aria-label="เปิดภาพ ${esc(r.invoiceNo)}"><img src="${esc(src)}" loading="lazy" class="aspect-[4/3] w-full object-cover grayscale transition group-hover:grayscale-0" alt="ภาพใบแจ้งหนี้ ${esc(r.invoiceNo)}"></button>`:`<div class="flex aspect-[4/3] items-center justify-center bg-zinc-900 font-mono text-2xl text-zinc-700">∅</div>`}<button class="w-full border-t border-zinc-900 p-3 text-left" data-record="${i}"><div class="truncate text-sm text-white">${esc(r.companyName||'ไม่ระบุบริษัท')}</div><div class="mt-1 flex justify-between gap-2 font-mono text-[10px] text-zinc-500"><span>${esc(r.invoiceNo||'ไม่มีเลข Inv.')}</span><span>${r.items.length} รายการ</span></div></button></div>`}
function detail(r){return `<div class="mb-6 flex items-start justify-between gap-3"><div><p class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-500">DETAIL VIEW / INVOICE</p><h2 class="mt-1 text-2xl font-medium text-white">${esc(r.invoiceNo||'ไม่มีเลข Invoice')}</h2><p class="mt-1 text-sm text-zinc-500">${esc(r.companyName||'ไม่ระบุบริษัท')} · ${esc(r.invoiceDate||'ไม่ระบุวันที่')} · บันทึกเมื่อ ${esc(r.createdAt||'ไม่ระบุเวลา')}</p></div><button class="rounded-md border border-zinc-700 px-3 py-2 text-xs text-zinc-300 hover:border-white" id="back-list">← กลับรายการ</button></div><div class="grid gap-3 border-y border-zinc-900 py-4 sm:grid-cols-4"><div><div class="label">บริษัท</div><div class="value">${esc(r.companyName||'—')}</div></div><div><div class="label">Tax ID</div><div class="value">${esc(r.taxId||'—')}</div></div><div><div class="label">พนักงานขาย</div><div class="value">${esc(r.salesperson||'—')}</div></div><div><div class="label">ยอดรวมสุทธิ</div><div class="value">${money(r.grandTotalInclVat)}</div></div></div><div class="mt-6 overflow-x-auto rounded-lg border border-zinc-900"><table class="w-full min-w-[760px] text-left text-sm"><thead class="bg-zinc-950 font-mono text-[10px] uppercase tracking-[.1em] text-zinc-500"><tr><th class="px-4 py-3">สินค้า</th><th class="px-4 py-3">GPU</th><th class="px-4 py-3">TPU</th><th class="px-4 py-3">จำนวน</th><th class="px-4 py-3">ราคา/หน่วย VAT</th><th class="px-4 py-3">รวมรายการ VAT</th></tr></thead><tbody class="divide-y divide-zinc-900">${r.items.map(x=>`<tr><td class="px-4 py-3 text-white">${esc(x.productName||'—')}</td><td class="px-4 py-3 font-mono text-xs text-zinc-400">${esc(x.gpuCode||'—')}</td><td class="px-4 py-3 font-mono text-xs text-zinc-400">${esc(x.tpuCode||'—')}</td><td class="px-4 py-3">${esc(x.quantity||'—')}</td><td class="px-4 py-3">${money(x.unitPriceInclVat)}</td><td class="px-4 py-3">${money(x.totalPriceInclVat)}</td></tr>`).join('')}</tbody></table></div><div class="mt-6 flex flex-wrap gap-2">${imageProxy(r.imageUrl)?`<button class="rounded-md bg-white px-4 py-3 text-sm font-medium text-black hover:bg-zinc-300" data-image="${esc(imageProxy(r.imageUrl))}">เปิดภาพ High-Res</button>`:''}<span class="rounded-md border border-zinc-800 px-4 py-3 font-mono text-xs text-zinc-500">${r.items.length} รายการใน Invoice</span></div>`}
function renderRecords(){const q=state.query.trim().toLowerCase();const filtered=state.records.filter(r=>(r.companyName+' '+r.invoiceNo).toLowerCase().includes(q));const active=state.selected?state.records[state.selected]:null;$('#records').innerHTML=active?detail(active):`<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"><div><p class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-500">03 / OCR RECORDS</p><h2 class="mt-1 text-2xl font-medium text-white">คลังข้อมูล OCR</h2><p class="mt-2 max-w-xl text-sm leading-6 text-zinc-500">Master View รวมข้อมูลตาม Invoice และเปิด Detail View เพื่อดูรายการสินค้าทั้งหมด</p></div><div class="flex gap-2"><input id="record-search" class="focus-signal w-full rounded-md border border-zinc-800 bg-black px-3 py-2.5 text-sm sm:w-64" placeholder="ค้นหาบริษัท / Invoice No." value="${esc(state.query)}"><button id="refresh-records" class="rounded-md border border-zinc-700 px-3 py-2 text-xs text-zinc-300 hover:border-white">รีเฟรช</button></div></div><div class="grid gap-5 xl:grid-cols-[minmax(0,1.35fr)_minmax(300px,.65fr)]"><section><div class="mb-3 flex items-center justify-between"><span class="font-mono text-[10px] uppercase tracking-[.12em] text-zinc-500">MASTER VIEW · ${filtered.length} INVOICES</span></div>${filtered.length?`<div class="overflow-x-auto rounded-lg border border-zinc-900"><table class="w-full min-w-[680px] text-left text-sm"><thead class="bg-zinc-950 font-mono text-[10px] uppercase tracking-[.1em] text-zinc-500"><tr><th class="px-4 py-3">บริษัท</th><th class="px-4 py-3">Invoice No.</th><th class="px-4 py-3">จำนวนรายการใน Inv.</th><th class="px-4 py-3">วันที่</th><th class="px-4 py-3">ยอดรวม</th></tr></thead><tbody class="divide-y divide-zinc-900">${filtered.map(r=>{const i=state.records.indexOf(r);return `<tr class="cursor-pointer hover:bg-zinc-950" data-record="${i}"><td class="px-4 py-3 text-white">${esc(r.companyName||'ไม่ระบุบริษัท')}</td><td class="px-4 py-3 font-mono text-xs text-zinc-300">${esc(r.invoiceNo||'—')}</td><td class="px-4 py-3 text-zinc-400">${r.items.length}</td><td class="px-4 py-3 text-zinc-500">${esc(r.invoiceDate||'—')}</td><td class="px-4 py-3">${money(r.grandTotalInclVat)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="rounded-lg border border-dashed border-zinc-800 p-12 text-center text-sm text-zinc-600">ยังไม่มีข้อมูล OCR ที่บันทึกไว้</div>`}</section><section><div class="mb-3 font-mono text-[10px] uppercase tracking-[.12em] text-zinc-500">IMAGE LIBRARY · THUMBNAILS</div><div class="grid grid-cols-2 gap-3">${filtered.slice(0,6).map(r=>recordCard(r,state.records.indexOf(r))).join('')}</div></section></div>`;bindRecords()}
function bindRecords(){const search=$('#record-search');if(search){search.oninput=()=>{state.query=search.value;renderRecords()};$('#refresh-records').onclick=loadRecords}document.querySelectorAll('[data-record]').forEach(el=>el.onclick=()=>{state.selected=Number(el.dataset.record);renderRecords()});document.querySelectorAll('[data-image]').forEach(el=>el.onclick=()=>openImage(el.dataset.image));$('#back-list')?.addEventListener('click',()=>{state.selected=null;renderRecords()})}
async function loadRecords(){const host=$('#records');host.innerHTML='<div class="py-20 text-center font-mono text-xs text-zinc-600">กำลังโหลดข้อมูล OCR…</div>';try{const {response,body}=await apiJson(await fetch('/api/invoices',{headers:{accept:'application/json'}}));if(!response.ok||!body.ok)throw new Error(body.error||'โหลดรายการไม่สำเร็จ');state.records=body.data.invoices||[];state.selected=null;renderRecords()}catch(e){host.innerHTML=`<div class="rounded-lg border border-red-900/60 p-10 text-center"><p class="text-sm text-red-300">${esc(e.message)}</p><button class="mt-4 rounded-md border border-zinc-700 px-3 py-2 text-xs" onclick="loadRecords()">ลองใหม่</button></div>`}}
function openImage(src){$('#image-modal').className='modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4';$('#image-full').src=src;$('#image-full').alt='ภาพ Invoice ความละเอียดสูง'}
function init(){document.body.innerHTML=`<div id="toast" class="hidden"></div><div id="image-modal" class="hidden" onclick="if(event.target.id==='image-modal')this.className='hidden'"><div class="relative flex max-h-[92vh] max-w-6xl items-center justify-center"><button class="absolute right-2 top-2 z-10 rounded-full bg-black/70 px-3 py-2 text-white" onclick="$('#image-modal').className='hidden'">ปิด</button><img id="image-full" class="max-h-[88vh] max-w-full rounded-lg object-contain" alt="ภาพ Invoice ความละเอียดสูง"></div></div><main class="mx-auto max-w-7xl px-4 py-5 sm:px-6 sm:py-8 lg:px-10"><header class="flex flex-col gap-4 border-b border-zinc-900 pb-6 sm:flex-row sm:items-start sm:justify-between"><div><p class="font-mono text-[10px] uppercase tracking-[.16em] text-zinc-500">INVOICE OCR / INVENTORY <span class="signal">●</span></p><h1 class="mt-2 text-4xl font-light leading-none tracking-[-.04em] text-white sm:text-6xl">อ่านบิล.<br>เก็บสต็อก.</h1></div><div class="flex flex-col gap-3 text-left sm:items-end sm:text-right"><div class="text-sm font-medium tracking-wide text-zinc-300">คลังยา รพ.สบปราบ</div><div class="font-doto text-lg text-white sm:text-2xl" id="clock">--:-- · --/--/----</div><nav class="flex gap-2 font-mono text-[10px] tracking-[.1em]"><button id="nav-upload" class="rounded border border-zinc-700 px-3 py-2 text-zinc-300 hover:border-white">UPLOAD / OCR</button><button id="nav-records" class="rounded border border-zinc-700 px-3 py-2 text-zinc-300 hover:border-white">OCR RECORDS</button></nav></div></header><section id="upload-view" class="mt-6 grid gap-5 lg:grid-cols-[minmax(280px,.72fr)_minmax(0,1.28fr)]"><section class="rounded-lg border border-zinc-900 bg-zinc-950 p-4 sm:p-6"><div class="mb-5 flex items-end justify-between"><div><p class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-500">01 / INPUT</p><h2 class="mt-1 text-xl font-medium text-white">อัปโหลดเอกสาร</h2></div><span class="font-mono text-xs text-zinc-600">12 MB</span></div><div id="drop" class="group flex min-h-[280px] flex-col items-center justify-center rounded-md border border-dashed border-zinc-800 px-5 py-8 text-center hover:border-zinc-500"><div class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-600">DRAG & DROP / CAMERA</div><p class="mt-3 text-sm leading-6 text-zinc-500">ถ่ายรูปหรือเลือกไฟล์บิล<br>JPG · PNG · WEBP · PDF</p><label class="mt-5 cursor-pointer rounded-md bg-white px-4 py-3 text-sm font-medium text-black hover:bg-zinc-300">เลือกไฟล์<input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label><img class="mt-5 hidden max-h-52 w-full rounded-md border border-zinc-800 object-contain" id="preview" alt="ตัวอย่างภาพบิล"><div class="mt-5 grid w-full grid-cols-2 gap-3 text-left"><div class="border-t border-zinc-900 pt-2"><div class="font-mono text-[10px] text-zinc-600">FILE</div><div class="mt-1 truncate font-mono text-xs text-zinc-400" id="filemeta">—</div></div><div class="border-t border-zinc-900 pt-2"><div class="font-mono text-[10px] text-zinc-600">STATUS</div><div class="mt-1 font-mono text-xs text-zinc-400">OCR READY</div></div></div></div><button class="mt-4 w-full rounded-md bg-white px-4 py-3 text-sm font-medium text-black hover:bg-zinc-300 disabled:opacity-40" id="extract">เริ่ม OCR</button><div id="status" class="mt-4 font-mono text-[11px] tracking-wide text-zinc-500">[READY]</div></section><section class="rounded-lg border border-zinc-900 bg-zinc-950 p-4 sm:p-6" id="review">${emptyReview()}</section></section><section id="records-view" class="mt-6 hidden"><div id="records"></div></section><footer class="mt-10 border-t border-zinc-900 pt-5 text-center font-mono text-[10px] tracking-[.1em] text-zinc-600">®TNP Develop 2027 Sobprab Pharmacy Department</footer></main>`;$('#file').onchange=e=>readFile(e.target.files[0]);$('#extract').onclick=extract;const drop=$('#drop');['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('border-red-700')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('border-red-700')}));drop.ondrop=e=>readFile(e.dataTransfer.files[0]);$('#nav-upload').onclick=()=>showView('upload');$('#nav-records').onclick=()=>showView('records');const updateClock=()=>{$('#clock').textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' · '+new Date().toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'})};updateClock();setInterval(updateClock,1000);if(location.pathname==='/records'||location.hash==='#records')showView('records')}
function showView(view){state.view=view;$('#upload-view').classList.toggle('hidden',view!=='upload');$('#records-view').classList.toggle('hidden',view!=='records');if(view==='records'){history.replaceState(null,'','/records');loadRecords()}else history.replaceState(null,'','/');}
init();

</script>
