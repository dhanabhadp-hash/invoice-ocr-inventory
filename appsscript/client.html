<script>
const state={file:null,previewUrl:'',data:{invoice:{},items:[]},busy:false};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const input=(label,key,value,type='text',extra='')=>`<label class="flex min-w-0 flex-col gap-2"><span class="font-mono text-[10px] uppercase tracking-[.12em] text-zinc-500">${label}</span><input class="focus-signal w-full rounded-md border border-zinc-800 bg-black px-3 py-2.5 text-sm text-zinc-100 placeholder:text-zinc-700" data-key="${key}" type="${type}" value="${esc(value)}" ${extra}></label>`;
function setStatus(text,kind=''){const el=$('#status');el.textContent='['+text+']';el.className='mt-4 font-mono text-[11px] tracking-wide '+(kind==='ok'?'status-ok':kind==='warn'?'status-warn':kind==='error'?'status-error':'text-zinc-500');}
function render(){const d=state.data,inv=d.invoice||{};$('#review').innerHTML=`<div class="mb-6 flex items-end justify-between gap-3"><div><p class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-500">02 / REVIEW</p><h2 class="mt-1 text-xl font-medium text-white">ตรวจสอบข้อมูล OCR</h2></div><span class="font-mono text-xs text-zinc-500">${d.items.length} รายการ</span></div><div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">${input('เลขที่บิล / INVOICE NO','invoiceNo',inv.invoiceNo)}${input('บริษัท / COMPANY','companyName',inv.companyName)}${input('เลขผู้เสียภาษี 13 หลัก','taxId',inv.taxId,'text','inputmode="numeric" maxlength="13"')}${input('วันที่ / DATE','invoiceDate',inv.invoiceDate,'date')}${input('พนักงานขาย / SALESPERSON','salesperson',inv.salesperson)}${input('ยอดรวมสุทธิ VAT / GRAND TOTAL','grandTotalInclVat',inv.grandTotalInclVat,'number','step="0.01"')}</div><div class="mt-8 flex items-center justify-between gap-3"><span class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-500">รายการสินค้า / LINE ITEMS</span><button class="rounded-md border border-zinc-700 px-3 py-2 text-xs text-zinc-300 transition hover:border-white hover:text-white" id="add">+ เพิ่มรายการ</button></div><div class="mt-3 space-y-3">${d.items.map((x,i)=>`<div class="grid grid-cols-1 gap-3 rounded-md border border-zinc-800 bg-zinc-950 p-3 sm:grid-cols-2 xl:grid-cols-[minmax(0,1.6fr)_80px_110px_110px_130px_130px_auto]" data-i="${i}">${itemInput('สินค้า','productName',x.productName,'sm:col-span-2 xl:col-span-1')}${itemInput('จำนวน','quantity',x.quantity,'','number')} ${itemInput('GPU CODE','gpuCode',x.gpuCode)}${itemInput('TPU CODE','tpuCode',x.tpuCode)}${itemInput('ราคา/หน่วย VAT','unitPriceInclVat',x.unitPriceInclVat,'','number')} ${itemInput('รวมรายการ VAT','totalPriceInclVat',x.totalPriceInclVat,'','number')}<button class="rounded-md border border-zinc-800 px-3 py-2 text-xs text-zinc-500 transition hover:border-red-700 hover:text-red-500" data-remove="${i}">ลบ</button></div>`).join('')}</div><div class="mt-4 whitespace-pre-line font-mono text-[11px] leading-6 text-amber-400">${(d.warnings||[]).map(esc).join('\n')}</div><div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button class="rounded-md border border-zinc-700 px-4 py-3 text-sm text-zinc-300 transition hover:border-white hover:text-white" id="reset">ล้างข้อมูล</button><button class="rounded-md bg-white px-4 py-3 text-sm font-medium text-black transition hover:bg-zinc-300 disabled:cursor-not-allowed disabled:opacity-40" id="save">บันทึกลง Google Sheets</button></div>`;bindReview();}
function itemInput(label,key,value,layout='',type='text'){return `<label class="flex min-w-0 flex-col gap-2 ${layout}"><span class="font-mono text-[10px] uppercase tracking-[.1em] text-zinc-500">${label}</span><input class="focus-signal w-full rounded-md border border-zinc-800 bg-zinc-900 px-3 py-2.5 text-sm text-zinc-100" data-item="${key}" type="${type}" value="${esc(value)}" ${type==='number'?'step="0.01"':''}></label>`}
function bindReview(){document.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>state.data.invoice[el.dataset.key]=el.value);document.querySelectorAll('[data-item]').forEach(el=>el.oninput=()=>{const item=state.data.items[el.closest('[data-i]').dataset.i];item[el.dataset.item]=el.type==='number'?Number(el.value):el.value});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{state.data.items.splice(Number(el.dataset.remove),1);render()});$('#add').onclick=()=>{state.data.items.push({productName:'',quantity:1,gpuCode:'',tpuCode:'',unitPriceInclVat:0,totalPriceInclVat:0});render()};$('#reset').onclick=()=>{state.data={invoice:{},items:[]};$('#review').innerHTML=emptyReview();setStatus('READY')};$('#save').onclick=save;}
function emptyReview(){return `<div class="flex min-h-[280px] flex-col items-center justify-center text-center"><div class="font-mono text-4xl text-zinc-800">◎</div><p class="mt-4 font-mono text-[11px] uppercase tracking-[.12em] text-zinc-600">อัปโหลดบิลเพื่อเริ่มตรวจสอบ</p></div>`}
function readFile(file){if(!file)return;if(file.size>12*1024*1024)return setStatus('ERROR: ไฟล์ใหญ่เกิน 12 MB','error');if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(file.type))return setStatus('ERROR: ชนิดไฟล์ไม่รองรับ','error');state.data={invoice:{},items:[]};state.file=file;if(state.previewUrl)URL.revokeObjectURL(state.previewUrl);state.previewUrl=URL.createObjectURL(file);const p=$('#preview');p.src=state.previewUrl;p.classList.remove('hidden');$('#filemeta').textContent=file.name+' · '+Math.round(file.size/1024)+' KB';setStatus('READY — กดเริ่ม OCR','ok');$('#review').innerHTML=emptyReview();}
async function extract(){if(!state.file)return setStatus('เลือกไฟล์ก่อน','warn');if(state.busy)return;state.busy=true;$('#extract').disabled=true;setStatus('OCR RUNNING — กำลังอ่านบิล');try{const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(state.file)});const response=await fetch('/api/ocr',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({base64,mimeType:state.file.type,fileName:state.file.name})});const r=await response.json();state.busy=false;$('#extract').disabled=false;if(!response.ok||!r.ok)return setStatus('ERROR: '+(r.error||'OCR ไม่สำเร็จ'),'error');state.data={invoice:r.data.invoice||{},items:r.data.items||[],warnings:r.data.warnings||[]};render();setStatus('REVIEW REQUIRED — ตรวจสอบก่อนบันทึก','warn')}catch(e){state.busy=false;$('#extract').disabled=false;setStatus('ERROR: '+e.message,'error')}}
function save(){if(state.busy)return;state.busy=true;setStatus('SAVING — กำลังบันทึก');fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(state.data)}).then(async response=>{const r=await response.json();if(!response.ok||!r.ok)throw new Error(r.error||'บันทึกไม่สำเร็จ');setStatus('SAVED — '+r.data.rowsSaved+' แถว','ok')}).catch(e=>setStatus('ERROR: '+e.message,'error')).finally(()=>{state.busy=false})}
function init(){document.body.innerHTML=`<main class="mx-auto max-w-7xl px-4 py-5 sm:px-6 sm:py-8 lg:px-10"><header class="flex flex-col gap-4 border-b border-zinc-900 pb-6 sm:flex-row sm:items-start sm:justify-between"><div><p class="font-mono text-[10px] uppercase tracking-[.16em] text-zinc-500">INVOICE OCR / INVENTORY <span class="signal">●</span></p><h1 class="mt-2 text-4xl font-light leading-none tracking-[-.04em] text-white sm:text-6xl">อ่านบิล.<br>เก็บสต็อก.</h1></div><div class="font-doto text-2xl text-white" id="clock">--:--</div></header><div class="mt-6 grid gap-5 lg:grid-cols-[minmax(280px,.72fr)_minmax(0,1.28fr)]"><section class="rounded-lg border border-zinc-900 bg-zinc-950 p-4 sm:p-6"><div class="mb-5 flex items-end justify-between"><div><p class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-500">01 / INPUT</p><h2 class="mt-1 text-xl font-medium text-white">อัปโหลดเอกสาร</h2></div><span class="font-mono text-xs text-zinc-600">12 MB</span></div><div id="drop" class="group flex min-h-[280px] flex-col items-center justify-center rounded-md border border-dashed border-zinc-800 px-5 py-8 text-center transition hover:border-zinc-500"><div class="font-mono text-[10px] uppercase tracking-[.14em] text-zinc-600">DRAG & DROP / CAMERA</div><p class="mt-3 text-sm leading-6 text-zinc-500">ถ่ายรูปหรือเลือกไฟล์บิล<br>JPG · PNG · WEBP · PDF</p><label class="mt-5 cursor-pointer rounded-md bg-white px-4 py-3 text-sm font-medium text-black transition hover:bg-zinc-300">เลือกไฟล์<input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label><img class="mt-5 hidden max-h-52 w-full rounded-md border border-zinc-800 object-contain" id="preview" alt="ตัวอย่างภาพบิล"><div class="mt-5 grid w-full grid-cols-2 gap-3 text-left"><div class="border-t border-zinc-900 pt-2"><div class="font-mono text-[10px] text-zinc-600">FILE</div><div class="mt-1 truncate font-mono text-xs text-zinc-400" id="filemeta">—</div></div><div class="border-t border-zinc-900 pt-2"><div class="font-mono text-[10px] text-zinc-600">STATUS</div><div class="mt-1 font-mono text-xs text-zinc-400">OCR READY</div></div></div></div><button class="mt-4 w-full rounded-md bg-white px-4 py-3 text-sm font-medium text-black transition hover:bg-zinc-300 disabled:cursor-not-allowed disabled:opacity-40" id="extract">เริ่ม OCR</button><div id="status" class="mt-4 font-mono text-[11px] tracking-wide text-zinc-500">[READY]</div></section><section class="rounded-lg border border-zinc-900 bg-zinc-950 p-4 sm:p-6" id="review">${emptyReview()}</section></div></main>`;$('#file').onchange=e=>readFile(e.target.files[0]);$('#extract').onclick=extract;const drop=$('#drop');['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('border-red-700')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('border-red-700')}));drop.ondrop=e=>readFile(e.dataTransfer.files[0]);setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),1000)}init();
</script>
