<style>@import url('https://fonts.googleapis.com/css2?family=Doto:wght@400;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');:root{--bg:#000;--surface:#111;--surface2:#1a1a1a;--border:#292929;--line:#333;--muted:#999;--text:#e8e8e8;--white:#fff;--red:#d71921;--green:#4a9e5c;--amber:#d4a843;--blue:#5b9bf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1280px;margin:auto;padding:28px clamp(16px,4vw,56px) 56px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:22px}.eyebrow,.label,.status{font:11px/1.2 'Space Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(30px,5vw,58px);line-height:1.05;margin:7px 0 0;color:var(--white);font-weight:500;letter-spacing:-.03em}.hero-dot{color:var(--red)}.clock{font-family:'Doto','Space Mono',monospace;font-size:28px;color:var(--white);text-align:right}.layout{display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,1.28fr);gap:24px;margin-top:32px}.station,.review{background:var(--surface);border:1px solid var(--border);padding:22px}.station{min-height:420px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:22px}.section-title{font-size:20px;font-weight:500;color:var(--white)}.upload{border:1px dashed var(--line);min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:border-color .2s}.upload.drag{border-color:var(--red)}.upload input{display:none}.upload-btn,.primary{border:0;background:var(--white);color:#000;padding:12px 18px;font-weight:500;border-radius:6px}.upload-btn:hover,.primary:hover{background:#dcdcdc}.preview{width:100%;max-height:240px;object-fit:contain;m
